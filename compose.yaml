services:
  postgres:
    image: postgres:18
    container_name: tree-editor-postgres

    environment:
      POSTGRES_DB: tree_editor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - tree-editor-postgres:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tree_editor"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/TreeEditor.Api/Dockerfile
    image: tree-editor-web
    container_name: tree-editor-web

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=tree_editor;Username=postgres;Password=postgres

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tree-editor-postgres:
